name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "assets/**"
      - "ios/**"
      - "macos/**"
      - "windows/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "backend/**"
      - "fabric/**"
      - "fabric-gateway-service/**"
      - "render.yaml"
      - ".github/workflows/dart.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "assets/**"
      - "ios/**"
      - "macos/**"
      - "windows/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "backend/**"
      - "fabric/**"
      - "fabric-gateway-service/**"
      - "render.yaml"
      - ".github/workflows/dart.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install pytest

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (release mode for demonstration)
        run: flutter build apk --release --dart-define=API_BASE_URL=https://honeychain-api.onrender.com

      - name: Prepare stable APK filename
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/honeychain-beekeeper.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeychain-beekeeper-apk
          path: build/app/outputs/flutter-apk/honeychain-beekeeper.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0-build-${{ github.run_number }}
          name: HoneyChain v3.0 Beekeeper APK Build ${{ github.run_number }}
          body: |
            HoneyChain Beekeeper Android demonstration build.

            Verified in CI with:
            - flutter analyze
            - flutter test
            - flutter build apk --release

            Distribution note:
            This is a release-mode APK signed with the temporary GitHub Actions debug key for evaluation.
            It is not Play Store or production signed. A previous test installation may need to be
            uninstalled before installing this build if its signing key differs.

            The live HoneyChain backend is currently unavailable; online synchronization is not active.
          files: build/app/outputs/flutter-apk/honeychain-beekeeper.apk
          generate_release_notes: false
