name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install pytest

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://honeychain-api.onrender.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeychain-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0-build-${{ github.run_number }}
          name: HoneyChain v3.0 APK Build ${{ github.run_number }}
          body: |
            HoneyChain v3.0 Android APK build.

            Built from main after:
            - flutter analyze
            - flutter test
            - flutter build apk --debug --dart-define=API_BASE_URL=https://honeychain-api.onrender.com
          files: build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: false
